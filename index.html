<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <title>Expositions</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <main class="page">

    <div
      id="maintenant-heading"
      class="section-heading section-heading-now"
      role="button"
      tabindex="0"
      aria-label="Aller aux expositions actuellement ouvertes"
    >
      <h1>Maintenant</h1>
    </div>

    <div id="current-list" class="exhibition-list">
      <p class="loading">Chargement…</p>
    </div>


    <div
      id="bientot-heading"
      class="section-heading section-heading-upcoming"
      role="button"
      tabindex="0"
      aria-label="Aller aux prochaines expositions"
    >
      <h2>Bientôt</h2>
    </div>

    <div id="upcoming-list" class="exhibition-list upcoming-list">
      <p class="loading">Chargement…</p>
    </div>

  </main>


  <div id="detail" class="detail" aria-hidden="true">

    <div class="detail-inner">

      <button
        id="detail-close"
        class="detail-close"
        type="button"
      >
        Fermer
      </button>

      <div id="detail-content"></div>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
